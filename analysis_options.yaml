analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-inference: true
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - no_duplicate_case_values
    - prefer_final_fields
    - unawaited_futures
    - use_build_context_synchronously
formatter:
  page_width: 120
